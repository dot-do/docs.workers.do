name: Auto-assign Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && (contains(github.event.review.body, '@claude') || (github.event.review.state == 'changes_requested' && contains(github.event.pull_request.labels.*.name, 'claude-code')))) ||
      (github.event_name == 'issues')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.head_ref }}
          fetch-depth: 0 # Full history for proper branching

      - name: Configure Git
        run: |
          git config --global user.name "Claude Code"
          git config --global user.email "claude-code[bot]@users.noreply.github.com"

      - name: Create working branch
        id: branch
        run: |
          # Check if this is a PR review event on an existing PR
          if [[ "${{ github.event_name }}" == "pull_request_review" ]] && [[ -n "${{ github.event.pull_request.head.ref }}" ]]; then
            # For PR reviews, work on the existing PR branch
            BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
            git checkout "$BRANCH_NAME"
            git pull origin "$BRANCH_NAME"
            echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
            echo "is_existing_pr=true" >> $GITHUB_OUTPUT
          else
            # For issues, create a new branch from latest main
            git fetch origin main
            git checkout main
            git pull origin main

            ISSUE_NUM="${{ github.event.issue.number || github.event.pull_request.number }}"
            BRANCH_NAME="claude/issue-${ISSUE_NUM}-$(date +%Y%m%d-%H%M%S)"

            # Delete local branch if it exists
            git branch -D "$BRANCH_NAME" 2>/dev/null || true

            # Delete remote branch if it exists
            git push origin --delete "$BRANCH_NAME" 2>/dev/null || true

            # Create new branch
            git checkout -b "$BRANCH_NAME"
            echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
            echo "is_existing_pr=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Provide a prompt for issue events, otherwise use comment body
          prompt: ${{ github.event_name == 'issues' && format('Please work on issue #{0}: {1}\n\n{2}', github.event.issue.number, github.event.issue.title, github.event.issue.body) || '' }}

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          # Allow Claude to read, edit, write files and run necessary commands
          claude_args: ''

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add .
          git commit -m "Claude: Automated changes for issue #${{ github.event.issue.number || github.event.pull_request.number }}

          Triggered by: ${{ github.event.comment.user.login || github.event.issue.user.login || github.event.pull_request.user.login }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Push branch
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git push origin "${{ steps.branch.outputs.branch_name }}"

      - name: Create Pull Request
        id: create-pr
        if: steps.changes.outputs.has_changes == 'true' && steps.branch.outputs.is_existing_pr != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM="${{ github.event.issue.number || github.event.pull_request.number }}"
          PR_TITLE="Claude: Changes for #${ISSUE_NUM}"
          PR_BODY="## Automated changes by Claude Code

          This PR was automatically created in response to [issue #${ISSUE_NUM}](${{ github.event.issue.html_url || github.event.pull_request.html_url }}).

          **Requested by:** @${{ github.event.comment.user.login || github.event.issue.user.login || github.event.pull_request.user.login }}
          **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Changes
          Claude has made the requested changes. Please review before merging.

          ### Working with this PR
          To have Claude handle merge conflicts or make additional changes:
          - Comment \`@claude\` with your request on this PR
          - Claude can run \`git merge\`, \`git pull\`, and \`gh pr\` commands
          - Claude will automatically commit and push changes

          Closes #${ISSUE_NUM}"

          PR_URL=$(gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base main \
            --head "${{ steps.branch.outputs.branch_name }}" \
            --label "automated,claude-code")

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Comment on PR with fixes
        if: steps.changes.outputs.has_changes == 'true' && steps.branch.outputs.is_existing_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          gh pr comment "$PR_NUM" --body "✅ I've addressed the review feedback and pushed fixes to this PR.

          **Changes committed:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Comment on issue with PR link
        if: steps.changes.outputs.has_changes == 'true' && github.event.issue.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM="${{ github.event.issue.number }}"
          PR_URL="${{ steps.create-pr.outputs.pr_url }}"

          gh issue comment "$ISSUE_NUM" --body "✅ I've created PR $PR_URL with the requested changes."

